$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = omarchy-system-lock
    after_sleep_cmd = omarchy-system-wake
    inhibit_sleep = 3
}

# ponytail: two idle triggers (this + quickshell's omarchy.idle) can race if
# quickshell's own timers are ever re-armed (e.g. via the bar's "allow idle"
# toggle). Kept quickshell's idle disabled at startup below to avoid that;
# if the bar toggle needs to matter again, strip the idle plugin from
# quickshell instead of running both.

listener {
    timeout = 150 # matches ~/.config/omarchy/shell.json idle.screensaver
    on-timeout = omarchy-launch-screensaver
}

listener {
    timeout = 300 # matches ~/.config/omarchy/shell.json idle.lock
    on-timeout = omarchy-system-lock
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
