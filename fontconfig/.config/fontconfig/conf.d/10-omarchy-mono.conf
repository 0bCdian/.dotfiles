<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Make generic "monospace" resolve to a Nerd Font so the omarchy shell bar
     (fc-match monospace) renders icon glyphs. Terminals pin their own fonts. -->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>CaskaydiaCove Nerd Font</string></edit>
  </match>
</fontconfig>
